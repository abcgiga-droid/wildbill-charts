# wildbill-charts nginx vhost — side-by-side with existing site.
# SAFE: separate server{} block, own server_name, proxies ONLY to 127.0.0.1:8910.
# Existing site vhosts untouched. After install: nginx -t && systemctl reload nginx
# (reload, NEVER restart — keeps existing connections/site up).
#
# Option A (recommended): subdomain, e.g. charts.example.com
#   1. cp deploy/nginx-charts.conf /etc/nginx/sites-available/wildbill-charts
#   2. edit server_name below to your subdomain
#   3. ln -s /etc/nginx/sites-available/wildbill-charts /etc/nginx/sites-enabled/
#   4. certbot --nginx -d charts.example.com   (only AFTER DNS points here)
#   5. nginx -t && systemctl reload nginx
#
# Option B (no DNS change): sub-path on existing domain — proxy /charts/ only.
#   Add the commented location block at the bottom inside your EXISTING server{}.
#   Only one of A/B should be active.

# --- Option A: dedicated subdomain ---
server {
    listen 80;
    # !!! EDIT ME: replace with your subdomain, e.g. charts.example.com
    server_name charts.example.com;

    # Big static JSON payloads (~1.2MB/symbol) — cache + compress.
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # Static history JSON: cache 1h client-side (refreshed via cron on droplet).
    location /data/ {
        proxy_pass http://127.0.0.1:8910/data/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Live delta API: never cache, short timeouts so a slow Yahoo call
    # can't pile up workers.
    location /api/ {
        proxy_pass http://127.0.0.1:8910/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store";
    }

    # Everything else (index.html, app.js, markets.js, tf.js).
    location / {
        proxy_pass http://127.0.0.1:8910/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

